{% extends "base.html" %}
{% block content %}
<p><a href="/coop">&larr; {{ t.back }}</a></p>
<h1>{{ farm.name }}</h1>
<p class="muted">{{ farm.member_no }} · {{ farm.phone }}</p>

<p class="banner {{ 'stop' if check.decision == 'test' else 'ok' }}">{{ verdict }}</p>

{% for d in details %}
<article class="cow stop">
  <header><strong>{{ d.animal }}</strong></header>
  <p>{{ d.line }}</p>
</article>
{% endfor %}

<form method="post" action="/coop/check/{{ farm.id }}" class="row card">
  <input name="clerk" placeholder="{{ t.name }}">
  <button class="primary">{{ t.log_check }}</button>
</form>
{% endblock %}
