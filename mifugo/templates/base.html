<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3a2e">
  <title>{% block title %}Mifugo{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Mifugo</a>
    <span class="tagline">{{ t.tagline }}</span>
    <nav class="lang">
      <a href="/lang/sw" class="{{ 'on' if lang == 'sw' }}">SW</a>
      <a href="/lang/en" class="{{ 'on' if lang == 'en' }}">EN</a>
    </nav>
  </header>
  <div class="model {{ 'up' if model.ok else 'down' }}">
    <span class="dot"></span>{{ model.label }}
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>{{ t.footer }}</footer>
</body>
</html>
